name: Feature Request
description: Suggest an idea for this project
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: dropdown
    id: affected-part
    attributes:
      label: Which part is affected?
      options:
        - app
        - circuits
        - contract
        - client SDK
        - e2e script
        - docs
    validations:
      required: true
