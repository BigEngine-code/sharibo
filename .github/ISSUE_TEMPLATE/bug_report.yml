name: Bug Report
description: Create a report to help us improve
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Tell us what should happen.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: How do we replicate the issue?
    validations:
      required: true
  - type: dropdown
    id: affected-part
    attributes:
      label: Which part is affected?
      options:
        - app
        - circuits
        - contract
        - client SDK
        - e2e script
        - docs
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include OS, Node version, Circom version, Stellar CLI version if applicable.
    validations:
      required: false
